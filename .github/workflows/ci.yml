name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: 8.0.424

      - name: Restore
        run: dotnet restore ZoomCheck.sln

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dashboard regression tests
        run: node --test tests/dashboard-regressions.cjs

      - name: Build
        run: dotnet build ZoomCheck.sln -c Release --no-restore

      - name: Test
        run: dotnet test ZoomCheck.sln -c Release --no-build
