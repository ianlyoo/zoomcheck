name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ZoomCheck.sln

      - name: Build
        run: dotnet build ZoomCheck.sln -c Release --no-restore

      - name: Test
        run: dotnet test ZoomCheck.sln -c Release --no-build
