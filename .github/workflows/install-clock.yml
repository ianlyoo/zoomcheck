name: Install clock
on:
  workflow_dispatch:
    inputs:
      update_probe:
        description: Check the v0.6.3 portable app for a newer release
        type: boolean
        required: false
        default: false
permissions:
  actions: read
  contents: read
jobs:
  stage-baseline:
    if: ${{ !inputs.update_probe }}
    runs-on: windows-latest
    steps:
      - name: Fetch v0.6.3 release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path base-setup,base-portable | Out-Null
          $base = 'https://github.com/ianlyoo/zoomcheck/releases/download/v0.6.3'
          Invoke-WebRequest "$base/ZoomCheck-Setup-x64.exe" -OutFile base-setup/ZoomCheck-Setup-x64.exe
          Invoke-WebRequest "$base/ZoomCheck-portable-win-x64.zip" -OutFile base-portable/ZoomCheck-portable-win-x64.zip
          Invoke-WebRequest "$base/SHA256SUMS.txt" -OutFile SHA256SUMS.txt
          foreach ($asset in @('ZoomCheck-Setup-x64.exe','ZoomCheck-portable-win-x64.zip')) {
            $dir = if ($asset -like '*Setup*') { 'base-setup' } else { 'base-portable' }
            $expected = ((Get-Content SHA256SUMS.txt | Where-Object { $_ -match [regex]::Escape($asset) }) -split '\s+')[0]
            if (-not $expected -or (Get-FileHash "$dir/$asset" -Algorithm SHA256).Hash -ne $expected) { throw "checksum mismatch: $asset" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: baseline-setup
          path: base-setup/ZoomCheck-Setup-x64.exe
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with:
          name: baseline-portable
          path: base-portable/ZoomCheck-portable-win-x64.zip
          retention-days: 2
  compare:
    needs: stage-baseline
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Alternate five clean runs of each version and package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_RUN: ${{ github.run_id }}
          ZOOMCHECK_Dashboard__OpenBrowserOnStart: 'false'
          ZOOMCHECK_Update__Enabled: 'false'
          ZOOMCHECK_ZoomRecovery__Enabled: 'false'
          ZOOMCHECK_ZoomRelay__Enabled: 'false'
        run: |
          $ErrorActionPreference = 'Stop'
          $old = (gh api repos/ianlyoo/zoomcheck/releases/tags/v0.6.3 | ConvertFrom-Json).assets
          $meta = gh api repos/ianlyoo/zoomcheck/actions/runs/44648840889 | ConvertFrom-Json
          if ($meta.head_sha -ne '30307869c52ed537dbf5e22f28727a968b7510db' -or $meta.conclusion -ne 'success') { throw 'wrong main build' }
          $mainArtifacts = gh api repos/ianlyoo/zoomcheck/actions/runs/44648840889/artifacts | ConvertFrom-Json
          foreach ($a in $old) { if ($a.name -like 'ZoomCheck*') { Write-Host "RELEASE_ASSET name=$($a.name) bytes=$($a.size)" } }
          foreach ($a in $mainArtifacts.artifacts) { Write-Host "BUILD_ARTIFACT name=$($a.name) zip_bytes=$($a.size_in_bytes)" }
          for ($i=1; $i -le 5; $i++) {
            $versions = if ($i % 2) { @('base','main') } else { @('main','base') }
            foreach ($package in @('setup','portable')) {
              foreach ($version in $versions) {
                $dir = Join-Path $env:RUNNER_TEMP "clock-$i-$package-$version"
                New-Item -ItemType Directory -Path $dir | Out-Null
                $env:ZOOMCHECK_Storage__DatabasePath = Join-Path $dir 'fresh.sqlite'
                $asset = if ($package -eq 'setup') { 'ZoomCheck-Setup-x64.exe' } else { 'ZoomCheck-portable-win-x64.zip' }
                $artifact = if ($version -eq 'base') { "baseline-$package" } elseif ($package -eq 'setup') { 'ZoomCheck-Setup-x64' } else { 'ZoomCheck-portable-win-x64' }
                $run = if ($version -eq 'base') { $env:BASE_RUN } else { '44648840889' }
                $t = [Diagnostics.Stopwatch]::StartNew()
                gh run download $run -R ianlyoo/zoomcheck -n $artifact -D $dir
                if ($LASTEXITCODE -ne 0) { throw "artifact download failed: $version $package" }
                $download = $t.Elapsed.TotalSeconds
                $file = Join-Path $dir $asset
                if (-not (Test-Path $file)) { throw "missing $file" }
                $bytes = (Get-Item $file).Length
                $start = $t.Elapsed.TotalSeconds
                if ($package -eq 'setup') {
                  $destination = Join-Path $dir 'app'
                  $p = Start-Process -FilePath $file -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$destination" -PassThru
                  $p.WaitForExit()
                  if ($p.ExitCode -ne 0) { throw "installer exit $($p.ExitCode)" }
                } else {
                  Expand-Archive $file -DestinationPath (Join-Path $dir 'app')
                }
                $end = $t.Elapsed.TotalSeconds
                if ($package -eq 'portable') {
                  $exe = Get-ChildItem (Join-Path $dir 'app') -Filter ZoomCheck.Backend.exe -Recurse | Select-Object -First 1
                  if (-not $exe) { throw 'portable backend missing' }
                  Start-Process $exe.FullName -WorkingDirectory $exe.DirectoryName
                }
                $poll = $t.Elapsed.TotalSeconds
                $deadline = $poll + 120
                $h = $null; $page = $null
                do {
                  try {
                    $h = Invoke-WebRequest 'http://127.0.0.1:5078/health' -TimeoutSec 2
                    $page = Invoke-WebRequest 'http://127.0.0.1:5078/' -TimeoutSec 2
                    if ($h.StatusCode -eq 200 -and $page.StatusCode -eq 200) { break }
                  } catch { Start-Sleep -Milliseconds 50 }
                } while ($t.Elapsed.TotalSeconds -lt $deadline)
                if (-not $h -or $h.StatusCode -ne 200 -or -not $page -or $page.StatusCode -ne 200) { throw 'health timeout' }
                $ready = $t.Elapsed.TotalSeconds
                $proc = Get-Process -Name 'ZoomCheck.Backend' -ErrorAction Stop
                if (@($proc).Count -ne 1) { throw 'expected one backend process' }
                $launchToReady = ([DateTime]::Now - $proc.StartTime).TotalSeconds
                $database = Get-Item $env:ZOOMCHECK_Storage__DatabasePath -ErrorAction Stop
                $dbCreatedFromLaunch = ($database.CreationTime - $proc.StartTime).TotalSeconds
                Write-Host "TRACE version=$version package=$package round=$i process_started_utc=$($proc.StartTime.ToUniversalTime().ToString('o')) db_created_utc=$($database.CreationTimeUtc.ToString('o')) health_utc=$([DateTime]::UtcNow.ToString('o')) db_created_from_launch_seconds=$dbCreatedFromLaunch db_bytes=$($database.Length)"
                Write-Host "CLOCK version=$version package=$package round=$i bytes=$bytes download_seconds=$download install_seconds=$($end-$start) poll_seconds=$($ready-$poll) install_plus_poll_seconds=$($ready-$start) launch_to_ready_seconds=$launchToReady"
                $proc | Stop-Process -PassThru | Wait-Process
              }
            }
          }
  startup-diagnostic:
    needs: compare
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6465016ae79be278e384da7a34f8fad1a8f7922a
          path: base-source
      - uses: actions/checkout@v4
        with:
          ref: 30307869c52ed537dbf5e22f28727a968b7510db
          path: main-source
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.424'
      - name: Measure fresh SQLite initialization at the repository boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $project = @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net8.0</TargetFramework><ImplicitUsings>enable</ImplicitUsings></PropertyGroup>
            <ItemGroup><ProjectReference Include="$(RepoRoot)/src/ZoomCheck.Infrastructure/ZoomCheck.Infrastructure.csproj" /></ItemGroup>
          </Project>
          '@
          $program = @'
          using System.Diagnostics;
          using ZoomCheck.Infrastructure.Persistence;
          var repo = new SqliteAttendanceRepository(args[0]);
          var sw = Stopwatch.StartNew();
          await repo.InitializeAsync();
          sw.Stop();
          Console.WriteLine($"INIT version={args[1]} round={args[2]} milliseconds={sw.Elapsed.TotalMilliseconds:F3} db_bytes={new FileInfo(args[0]).Length}");
          '@
          foreach ($v in @('base','main')) {
            $p = Join-Path $env:RUNNER_TEMP "harness-$v"
            New-Item -ItemType Directory -Path $p | Out-Null
            Set-Content -Encoding utf8 (Join-Path $p 'Measure.csproj') $project
            Set-Content -Encoding utf8 (Join-Path $p 'Program.cs') $program
            $repo = Join-Path $env:GITHUB_WORKSPACE "$v-source"
            dotnet build (Join-Path $p 'Measure.csproj') -c Release "-p:RepoRoot=$repo" --nologo --verbosity quiet
            if ($LASTEXITCODE -ne 0) { throw "build failed for $v" }
          }
          for ($i=1; $i -le 10; $i++) {
            $order = if ($i % 2) { @('base','main') } else { @('main','base') }
            foreach ($v in $order) {
              $dll = Join-Path $env:RUNNER_TEMP "harness-$v/bin/Release/net8.0/Measure.dll"
              $database = Join-Path $env:RUNNER_TEMP "fresh-init-$v-$i.sqlite"
              dotnet $dll $database $v $i
              if ($LASTEXITCODE -ne 0) { throw "initialization failed for $v round $i" }
            }
          }
  update-probe:
    if: ${{ inputs.update_probe }}
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - name: Check v0.6.3 portable update status
        shell: pwsh
        env:
          ZOOMCHECK_Update__Enabled: 'true'
          ZOOMCHECK_Update__CheckOnStartup: 'true'
          ZOOMCHECK_Update__AutomaticDownload: 'false'
          ZOOMCHECK_Dashboard__OpenBrowserOnStart: 'false'
          ZOOMCHECK_ZoomRecovery__Enabled: 'false'
          ZOOMCHECK_ZoomRelay__Enabled: 'false'
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'https://github.com/ianlyoo/zoomcheck/releases/download/v0.6.3'
          $zip = 'ZoomCheck-portable-win-x64.zip'
          Invoke-WebRequest "$base/$zip" -OutFile $zip
          Invoke-WebRequest "$base/SHA256SUMS.txt" -OutFile SHA256SUMS.txt
          $expected = ((Get-Content SHA256SUMS.txt | Where-Object { $_ -match [regex]::Escape($zip) }) -split '\s+')[0]
          if (-not $expected -or (Get-FileHash $zip -Algorithm SHA256).Hash -ne $expected) { throw 'portable checksum mismatch' }
          Expand-Archive $zip -DestinationPath portable
          $exe = Get-ChildItem portable -Filter ZoomCheck.Backend.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'Portable executable missing' }
          $backendOut = Join-Path $env:RUNNER_TEMP 'zoomcheck-update-output.log'
          $backendErr = Join-Path $env:RUNNER_TEMP 'zoomcheck-update-error.log'
          Start-Process $exe.FullName -WorkingDirectory $exe.DirectoryName -RedirectStandardOutput $backendOut -RedirectStandardError $backendErr
          $deadline = (Get-Date).AddSeconds(65)
          $status = $null; $raw = $null
          do {
            try {
              $response = Invoke-WebRequest 'http://127.0.0.1:5078/api/update/status' -TimeoutSec 3
              $raw = $response.Content
              $status = $raw | ConvertFrom-Json
              if ($status.lastCheckedAt) { break }
            } catch { Write-Host 'Waiting for update status endpoint.' }
            Start-Sleep -Seconds 2
          } while ((Get-Date) -lt $deadline)
          if ($raw) { Write-Host "UPDATE_STATUS_JSON=$raw" }
          if (Test-Path $backendOut) { Select-String -Path $backendOut -Pattern 'Update check finished|Update check could not|Update check failed' | ForEach-Object { Write-Host "BACKEND_UPDATE_LOG=$($_.Line)" } }
          if (-not $status) { throw 'Update status endpoint did not answer.' }
          if (-not $status.lastCheckedAt) { Write-Host 'UPDATE_RESULT=lastCheckedAt-unset'; exit 0 }
          if ($status.availability -ne 'UpdateAvailable') { Write-Host 'UPDATE_RESULT=not-update-available'; exit 0 }
          if ($status.currentVersion -ne '0.6.3' -or $status.latestVersion -ne '0.7.0') { Write-Host 'UPDATE_RESULT=unexpected-version'; exit 0 }
          if ($status.downloadState -ne 'None' -or $status.installerReady) { throw 'Unexpected installer download or staged installer.' }
          Write-Host 'UPDATE_RESULT=expected'
