name: Build Windows Installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional tag name for creating a GitHub release
        required: false
        type: string
  push:
    branches:
      - main

permissions:
  actions: read
  contents: write

env:
  INSTALLER_PATH: dist/installer/ZoomCheck-Setup-x64.exe
  PORTABLE_PATH: dist/portable/ZoomCheck-portable-win-x64.zip
  CHECKSUM_PATH: dist/installer/SHA256SUMS.txt

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: 8.0.424

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Restore
        run: dotnet restore ZoomCheck.sln

      - name: Test
        run: dotnet test ZoomCheck.sln -c Release --no-restore

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dashboard regression tests
        run: node --test tests/dashboard-regressions.cjs

      - name: Resolve package version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          $releaseTag = $env:RELEASE_TAG_INPUT.Trim()
          [xml]$project = Get-Content 'src/ZoomCheck.Backend/ZoomCheck.Backend.csproj'
          $sourceVersion = [string]$project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($releaseTag)) {
            $packageVersion = $sourceVersion
          }
          elseif ($releaseTag -match '^v?(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?)$') {
            $packageVersion = $Matches.version
          }
          else {
            throw "release_tag must be a semantic version such as v0.6.0 or v0.6.0-rc.1."
          }

          if ($packageVersion -ne $sourceVersion) {
            throw "Release version $packageVersion does not match source version $sourceVersion."
          }

          "package_version=$packageVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Package version: $packageVersion"

      # Publishes ZoomCheck.Backend (win-x64, self-contained) as the single
      # package root, runs the packaging guard, then emits the portable ZIP and
      # the installer.
      - name: Build package, portable ZIP and installer
        shell: powershell
        # Public releases never embed a maintainer's personal relay URL. Each operator deploys
        # their own HTTPS relay and configures it locally after installation.
        run: .\deploy\windows\build-installer.ps1 -Configuration Release -Runtime win-x64 -Version ${{ steps.version.outputs.package_version }}

      - name: Verify build outputs
        shell: pwsh
        run: |
          $expected = @(
            "${{ env.INSTALLER_PATH }}",
            "${{ env.PORTABLE_PATH }}",
            "${{ env.CHECKSUM_PATH }}",
            "dist/windows/package/ZoomCheck.Backend.exe",
            "dist/windows/package/wwwroot/index.html",
            "dist/windows/package/wwwroot/zoom-app/index.html"
          )
          $missing = $expected | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            $missing | ForEach-Object { Write-Error "Missing expected output: $_" }
            exit 1
          }
          if (Get-ChildItem dist/windows/package -Filter "ZoomCheck.App*" -Recurse -Force -ErrorAction SilentlyContinue) {
            Write-Error "Avalonia desktop shell (ZoomCheck.App) must not be packaged."
            exit 1
          }
          Write-Host "All expected outputs present."

      # Independent audit of the shipped ZIP: the packaging guard runs against
      # the publish folder, this one inspects the archive that users download.
      - name: Audit portable ZIP for secrets, databases and user data
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zipPath = (Resolve-Path "${{ env.PORTABLE_PATH }}").Path
          $zip = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            $entries = $zip.Entries | ForEach-Object { $_.FullName -replace '\\', '/' }
            $settingsEntry = $zip.Entries | Where-Object { $_.FullName -eq "appsettings.json" } | Select-Object -First 1
            if (-not $settingsEntry) {
              Write-Error "Portable ZIP has no appsettings.json."
              exit 1
            }
            $reader = [System.IO.StreamReader]::new($settingsEntry.Open())
            try {
              $config = $reader.ReadToEnd() | ConvertFrom-Json
            } finally {
              $reader.Dispose()
            }
          } finally {
            $zip.Dispose()
          }

          $forbidden = @(
            '\.db$', '\.db-shm$', '\.db-wal$', '\.sqlite3?$',
            '(^|/)\.env($|\.)', '\.env$',
            '\.pfx$', '\.p12$', '\.pem$', '\.key$', '\.keystore$', '\.jks$',
            '(^|/)secrets\.json$', '\.secrets\.json$',
            '(^|/)appsettings\.(Development|Local|User)\.json$',
            '\.log$', '\.xlsx?$', '\.csv$',
            '(^|/)data/', '(^|/)logs/',
            '(^|/)ZoomCheck\.App'
          )

          $violations = foreach ($entry in $entries) {
            foreach ($pattern in $forbidden) {
              if ($entry -match $pattern) {
                "$entry (matched $pattern)"
                break
              }
            }
          }

          if ($violations) {
            Write-Host "Portable ZIP audit failed:"
            $violations | ForEach-Object { Write-Error $_ }
            exit 1
          }

          # The appsettings.json inside the shipped archive must remain generic.
          foreach ($secretKey in @("WebhookSecretToken", "ClientId", "ClientSecret", "AccountId")) {
            if (-not [string]::IsNullOrWhiteSpace([string]$config.Zoom.$secretKey)) {
              Write-Error "appsettings.json ships a populated Zoom secret: Zoom.$secretKey"
              exit 1
            }
          }
          if (-not [string]::IsNullOrWhiteSpace([string]$config.ZoomRelay.BaseUrl)) {
            Write-Error "Public release must not embed a ZoomRelay.BaseUrl."
            exit 1
          }

          Write-Host "Portable ZIP audit passed ($($entries.Count) entries)."

      # SignPath Foundation code signing runs on workflow_dispatch builds only when the
      # repository secret and variables are configured, keeping unsigned builds green beforehand.
      - name: Check SignPath configuration
        id: signpath-config
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          $hasConfig = -not [string]::IsNullOrWhiteSpace($env:SIGNPATH_API_TOKEN) -and
            -not [string]::IsNullOrWhiteSpace($env:SIGNPATH_ORGANIZATION_ID) -and
            -not [string]::IsNullOrWhiteSpace($env:SIGNPATH_PROJECT_SLUG) -and
            -not [string]::IsNullOrWhiteSpace($env:SIGNPATH_SIGNING_POLICY_SLUG)
          $isDispatch = "${{ github.event_name }}" -eq "workflow_dispatch"
          $enabled = $hasConfig -and $isDispatch
          "enabled=$($enabled.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if ($enabled) {
            Write-Host "SignPath signing enabled for workflow_dispatch run."
          }
          elseif (-not $hasConfig) {
            Write-Host "SignPath secrets/variables are not configured; skipping code signing."
          }
          else {
            Write-Host "SignPath signing runs only on workflow_dispatch builds; skipping code signing."
          }

      - name: Upload unsigned installer for SignPath
        id: upload-unsigned-installer
        if: steps.signpath-config.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ZoomCheck-Setup-x64-unsigned
          path: ${{ env.INSTALLER_PATH }}
          if-no-files-found: error
          retention-days: 1

      - name: Sign installer with SignPath
        id: signpath
        if: steps.signpath-config.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: dist/installer-signed

      - name: Apply signed installer and refresh SHA256SUMS.txt
        if: steps.signpath-config.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $signedInstaller = Get-ChildItem -Path "dist/installer-signed" -Filter "ZoomCheck-Setup-x64.exe" -Recurse -File | Select-Object -First 1
          if (-not $signedInstaller) {
            Write-Error "Signed installer ZoomCheck-Setup-x64.exe was not found in dist/installer-signed."
            exit 1
          }
          $sig = Get-AuthenticodeSignature -FilePath $signedInstaller.FullName
          if ($sig.Status -ne 'Valid') {
            Write-Error "Signed installer Authenticode signature is not valid: $($sig.Status) ($($sig.StatusMessage))"
            exit 1
          }
          Copy-Item -LiteralPath $signedInstaller.FullName -Destination "${{ env.INSTALLER_PATH }}" -Force
          $installerHash = (Get-FileHash -LiteralPath "${{ env.INSTALLER_PATH }}" -Algorithm SHA256).Hash.ToLowerInvariant()
          $portableHash = (Get-FileHash -LiteralPath "${{ env.PORTABLE_PATH }}" -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumLines = @(
            "$installerHash  ZoomCheck-Setup-x64.exe",
            "$portableHash  ZoomCheck-portable-win-x64.zip"
          ) -join "`n"
          [IO.File]::WriteAllText("${{ env.CHECKSUM_PATH }}", $checksumLines + "`n", [Text.Encoding]::ASCII)
          Write-Host "Applied signed installer (Subject: $($sig.SignerCertificate.Subject)) and refreshed ${{ env.CHECKSUM_PATH }}."

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ZoomCheck-Setup-x64
          path: ${{ env.INSTALLER_PATH }}
          if-no-files-found: error

      - name: Upload portable ZIP artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ZoomCheck-portable-win-x64
          path: ${{ env.PORTABLE_PATH }}
          if-no-files-found: error

      - name: Upload checksum artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ZoomCheck-SHA256SUMS
          path: ${{ env.CHECKSUM_PATH }}
          if-no-files-found: error

      - name: Create GitHub release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_TARGET: ${{ github.sha }}
          RELEASE_VERSION: ${{ steps.version.outputs.package_version }}
        shell: pwsh
        run: |
          $notesPath = "docs/releases/v${env:RELEASE_VERSION}.md"
          $notesArgs = @('--generate-notes')
          if (Test-Path -LiteralPath $notesPath) {
            $notesArgs = @('--notes-file', $notesPath)
          }
          gh release create $env:RELEASE_TAG `
          "${{ env.INSTALLER_PATH }}" `
          "${{ env.PORTABLE_PATH }}" `
          "${{ env.CHECKSUM_PATH }}" `
          --target $env:RELEASE_TARGET `
          --title "ZoomCheck $env:RELEASE_TAG" `
          @notesArgs `
          --latest
